<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RX Threat Dashboard</title>
<style>
:root{
  --primary:#22c55e;
  --primary-dark:#16a34a;
  --bg:#0f172a;
  --card-bg:#1e293b;
  --text:#e2e8f0;
  --safe:#4ade80;
  --risk:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:20px;}
.container{max-width:800px;width:100%;background:var(--card-bg);border-radius:16px;padding:30px;box-shadow:0 10px 25px rgba(0,0,0,0.5);}
h1{text-align:center;margin-bottom:20px;}
footer{text-align:center;color:#aaa;margin-top:20px;font-size:13px;}
input[type="text"],input[type="file"]{width:100%;padding:12px;margin-bottom:15px;border-radius:10px;border:none;background:#0f172a;color:#fff;}
button{width:100%;padding:14px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-weight:600;cursor:pointer;transition:0.3s;}
button:disabled{opacity:0.6;cursor:not-allowed;}
button:hover:not(:disabled){background:var(--primary-dark);}
.progress-container{width:100%;height:8px;background:#0f172a;border-radius:8px;overflow:hidden;margin-top:15px;display:none;}
.progress-bar{height:100%;width:0%;background:var(--primary);transition:0.15s linear;}
.result{margin-top:15px;font-weight:600;min-height:22px;}
.safe{color:var(--safe);}
.risk{color:var(--risk);}
</style>
</head>
<body>
<div class="container">
<h1>RX Threat Dashboard</h1>

<!-- URL Scan -->
<input type="text" id="urlInput" placeholder="Enter URL to scan">

<div style="text-align:center;margin:10px 0;">OR</div>

<!-- File Scan -->
<input type="file" id="fileInput">

<button id="scanBtn">Run Scan</button>

<div class="progress-container" id="progressBox">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="result" id="resultText"></div>

<footer>Powered by kalsNotDev 🖐</footer>
</div>

<script>
const scanBtn = document.getElementById("scanBtn");
const urlInput = document.getElementById("urlInput");
const fileInput = document.getElementById("fileInput");
const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");
const resultText = document.getElementById("resultText");

// Ganti ini dengan URL backend Render lu
const API_BASE = "https://rx-threat-backend.onrender.com";

scanBtn.addEventListener("click", runScan);
urlInput.addEventListener("keypress", e => { if(e.key === "Enter") runScan(); });

async function runScan() {
  scanBtn.disabled = true;
  resultText.textContent = "Scanning...";
  resultText.className = "result";
  progressBox.style.display = "block";
  progressBar.style.width = "0%";

  let progress = 0;
  const interval = setInterval(() => {
    progress += 5;
    progressBar.style.width = progress + "%";
    if(progress >= 100) { clearInterval(interval); finishScan(); }
  }, 80);
}

async function finishScan() {
  let data;
  try {
    if(fileInput.files[0]){
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      const res = await fetch(API_BASE + "/scan-file", { method:"POST", body: formData });
      data = await res.json();
    } else {
      const res = await fetch(API_BASE + "/scan-url", {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ url: urlInput.value })
      });
      data = await res.json();
    }
  } catch(err) {
    resultText.textContent = "Scan failed!";
    resultText.className = "result risk";
    scanBtn.disabled = false;
    return;
  }

  // Demo hasil threat (kalau API aktif bisa diganti dengan data nyata)
  const threat = Math.random() > 0.5 ? 1 : 0;
  if(threat){
    resultText.textContent = "⚠ High Risk Threat Detected!";
    resultText.className = "result risk";
  } else {
    resultText.textContent = "✓ No Threat Found. System Safe.";
    resultText.className = "result safe";
  }
  scanBtn.disabled = false;
}
</script>
</body>
</html>
