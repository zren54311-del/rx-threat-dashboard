<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SecureScanX Enterprise - Advanced Threat Detection Dashboard">
<title>SecureScanX Enterprise</title>

<style>
:root{
  --primary:#4f9cff;
  --primary-dark:#2563eb;
  --bg1:#0f2027;
  --bg2:#203a43;
  --bg3:#2c5364;
  --safe:#4ade80;
  --risk:#f87171;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
  color:#fff;
}

main{
  width:95%;
  max-width:820px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-radius:22px;
  padding:40px;
  box-shadow:0 25px 60px rgba(0,0,0,0.5);
}

header{
  text-align:center;
  margin-bottom:30px;
}

header p{
  opacity:0.7;
  margin-top:6px;
}

.stats{
  display:flex;
  gap:15px;
  margin:25px 0;
}

.stat-box{
  flex:1;
  background:rgba(255,255,255,0.1);
  padding:18px;
  border-radius:16px;
  text-align:center;
}

.stat-box h3{
  font-size:13px;
  opacity:0.7;
}

.stat-box p{
  font-size:20px;
  font-weight:600;
  margin-top:6px;
}

.tabs{
  display:flex;
  gap:25px;
  margin:20px 0;
}

.tab{
  cursor:pointer;
  opacity:0.6;
  padding-bottom:5px;
}

.tab.active{
  opacity:1;
  border-bottom:2px solid var(--primary);
}

input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:none;
  margin-bottom:15px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(90deg,var(--primary),var(--primary-dark));
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

button:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

button:hover:not(:disabled){
  transform:translateY(-3px);
  box-shadow:0 10px 25px rgba(79,156,255,0.4);
}

.progress-container{
  width:100%;
  height:8px;
  background:rgba(255,255,255,0.2);
  border-radius:10px;
  overflow:hidden;
  margin-top:18px;
  display:none;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--primary),var(--primary-dark));
  transition:width 0.12s linear;
}

.result{
  margin-top:18px;
  font-weight:600;
  min-height:22px;
}

.safe{color:var(--safe);}
.risk{color:var(--risk);}

@media(max-width:600px){
  .stats{flex-direction:column;}
}
</style>
</head>

<body>

<main>
  <header>
    <h1>SecureScanX Enterprise</h1>
    <p>Advanced Threat Detection & Analysis</p>
  </header>

  <section class="stats">
    <div class="stat-box">
      <h3>Total Scans</h3>
      <p id="totalCount">0</p>
    </div>
    <div class="stat-box">
      <h3>High Risk</h3>
      <p id="riskCount">0</p>
    </div>
    <div class="stat-box">
      <h3>Safe</h3>
      <p id="safeCount">0</p>
    </div>
  </section>

  <section>
    <input id="scanInput" type="text" placeholder="Enter file name, URL, or IP address" aria-label="Scan Input">
    <button id="scanBtn">Run Security Scan</button>

    <div class="progress-container" id="progressBox">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="result" id="resultText" role="status" aria-live="polite"></div>
  </section>
</main>

<script>
const totalCount=document.getElementById("totalCount");
const riskCount=document.getElementById("riskCount");
const safeCount=document.getElementById("safeCount");
const progressBox=document.getElementById("progressBox");
const progressBar=document.getElementById("progressBar");
const resultText=document.getElementById("resultText");
const scanBtn=document.getElementById("scanBtn");
const scanInput=document.getElementById("scanInput");

let stats=JSON.parse(localStorage.getItem("scanStats"))||{
  total:0,
  risk:0,
  safe:0
};

updateUI();

scanBtn.addEventListener("click",runScan);
scanInput.addEventListener("keypress",e=>{
  if(e.key==="Enter") runScan();
});

function runScan(){
  const value=scanInput.value.trim();
  if(!value){
    resultText.textContent="Please enter valid input.";
    resultText.className="result risk";
    return;
  }

  scanBtn.disabled=true;
  progressBox.style.display="block";
  progressBar.style.width="0%";
  resultText.textContent="Scanning...";
  resultText.className="result";

  let progress=0;

  const interval=setInterval(()=>{
    progress+=4;
    progressBar.style.width=progress+"%";

    if(progress>=100){
      clearInterval(interval);
      finishScan();
    }
  },50);
}

function finishScan(){
  stats.total++;

  if(Math.random()>0.5){
    stats.risk++;
    resultText.textContent="⚠ High Risk Threat Detected!";
    resultText.classList.add("risk");
  }else{
    stats.safe++;
    resultText.textContent="✓ No Threat Found. System Safe.";
    resultText.classList.add("safe");
  }

  localStorage.setItem("scanStats",JSON.stringify(stats));
  updateUI();

  scanBtn.disabled=false;
}

function updateUI(){
  totalCount.textContent=stats.total;
  riskCount.textContent=stats.risk;
  safeCount.textContent=stats.safe;
}
</script>

</body>
  </html>
